<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Corner — Find it nearby</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F6F4EE;
    --ink:#171F19;
    --ink-soft:#4B5750;
    --line:#DEDACC;
    --card:#FFFFFF;
    --green:#2F5233;
    --green-deep:#1E3A22;
    --green-mist:#E4EBE1;
    --brick:#B85C34;
    --brick-mist:#F3E4D9;
    --gold:#C79A3D;
    --red:#B23B32;
    --radius-s:6px;
    --radius-m:10px;
    --radius-l:16px;
    --shadow: 0 1px 2px rgba(23,31,25,.06), 0 6px 16px -8px rgba(23,31,25,.18);
    --maxw: 480px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'Work Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
  }
  h1,h2,h3,.display{
    font-family:'Fraunces', Georgia, serif;
    font-weight:600;
    letter-spacing:-0.01em;
    margin:0;
    color:var(--ink);
  }
  p{margin:0;}
  button{font-family:inherit;}
  a{color:inherit;text-decoration:none;}
  img{display:block;max-width:100%;}
  ::selection{background:var(--green-mist);}
  :focus-visible{outline:2px solid var(--green); outline-offset:2px;}

  #app{
    max-width:var(--maxw);
    margin:0 auto;
    min-height:100vh;
    background:var(--paper);
    position:relative;
    display:flex;
    flex-direction:column;
    box-shadow:0 0 40px rgba(0,0,0,0.06);
  }

  /* ---- Top bar ---- */
  .topbar{
    position:sticky; top:0; z-index:40;
    background:var(--paper);
    border-bottom:1px solid var(--line);
    padding:12px 16px 10px;
  }
  .topbar-row{display:flex; align-items:center; justify-content:space-between; gap:10px;}
  .brand{display:flex; align-items:center; gap:8px; cursor:pointer;}
  .brand-mark{
    width:30px;height:30px;border-radius:8px;
    background:var(--green);
    display:flex;align-items:center;justify-content:center;
    color:#fff; font-family:'Fraunces',serif; font-weight:700; font-size:16px;
    flex-shrink:0;
  }
  .brand-name{font-family:'Fraunces',serif; font-weight:600; font-size:19px;}
  .loc-pill{
    display:flex; align-items:center; gap:6px;
    border:1px solid var(--line); background:var(--card);
    border-radius:999px; padding:6px 12px; font-size:12.5px; color:var(--ink-soft);
    cursor:pointer; max-width:150px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .role-switch{
    display:flex; gap:4px; margin-top:10px; background:var(--green-mist); padding:3px; border-radius:999px;
  }
  .role-btn{
    flex:1; border:none; background:transparent; padding:7px 4px; border-radius:999px;
    font-size:12px; font-weight:600; color:var(--green-deep); cursor:pointer;
  }
  .role-btn.active{background:var(--card); box-shadow:var(--shadow);}

  /* ---- Layout helpers ---- */
  .view{padding:14px 16px 90px;}
  .section{margin-bottom:26px;}
  .section-head{display:flex; align-items:baseline; justify-content:space-between; margin-bottom:10px;}
  .section-head h2{font-size:17px;}
  .link-btn{background:none;border:none;color:var(--green); font-weight:600; font-size:13px; cursor:pointer; padding:0;}
  .muted{color:var(--ink-soft);}
  .small{font-size:12.5px;}

  /* ---- Search bar ---- */
  .searchbar{
    display:flex; align-items:center; gap:8px;
    background:var(--card); border:1.5px solid var(--line); border-radius:var(--radius-m);
    padding:12px 14px; cursor:text;
  }
  .searchbar input{
    border:none; outline:none; background:transparent; font-size:15px; width:100%; color:var(--ink); font-family:inherit;
  }
  .searchbar input::placeholder{color:#8A9088;}
  .searchbar svg{flex-shrink:0;}

  /* ---- Hero ---- */
  .hero{
    background:linear-gradient(180deg, var(--green-deep), var(--green));
    color:#fff; border-radius:var(--radius-l); padding:22px 18px 20px; margin-bottom:18px;
  }
  .hero h1{color:#fff; font-size:26px; line-height:1.15; margin-bottom:6px;}
  .hero p{color:#D8E4D6; font-size:13.5px; margin-bottom:16px;}
  .hero .searchbar{border:none;}

  /* ---- Category chips ---- */
  .chip-row{display:flex; gap:8px; overflow-x:auto; padding-bottom:4px; -ms-overflow-style:none; scrollbar-width:none;}
  .chip-row::-webkit-scrollbar{display:none;}
  .chip{
    flex-shrink:0; display:flex; flex-direction:column; align-items:center; gap:6px;
    width:66px; cursor:pointer;
  }
  .chip .ico{
    width:52px;height:52px;border-radius:16px; background:var(--card); border:1px solid var(--line);
    display:flex; align-items:center; justify-content:center; font-size:22px;
  }
  .chip span{font-size:11px; text-align:center; color:var(--ink-soft); font-weight:500; line-height:1.2;}

  /* ---- Filter row ---- */
  .filter-row{display:flex; gap:8px; overflow-x:auto; padding-bottom:6px; -ms-overflow-style:none; scrollbar-width:none;}
  .filter-row::-webkit-scrollbar{display:none;}
  .filter-chip{
    flex-shrink:0; border:1px solid var(--line); background:var(--card); color:var(--ink);
    border-radius:999px; padding:7px 13px; font-size:12.5px; font-weight:500; cursor:pointer; white-space:nowrap;
  }
  .filter-chip.active{background:var(--green); border-color:var(--green); color:#fff;}
  .sortbar{display:flex; align-items:center; justify-content:space-between; margin:12px 0 10px;}
  .select-native{
    border:1px solid var(--line); background:var(--card); border-radius:var(--radius-s); padding:6px 8px; font-size:12.5px; color:var(--ink);
  }

  /* ---- Product card ---- */
  .p-card{
    display:flex; gap:12px; background:var(--card); border:1px solid var(--line); border-radius:var(--radius-m);
    padding:12px; margin-bottom:10px; cursor:pointer; transition:border-color .15s;
  }
  .p-card:active{border-color:var(--green);}
  .p-thumb{
    width:72px;height:72px;border-radius:var(--radius-s); background:var(--green-mist); flex-shrink:0;
    display:flex; align-items:center; justify-content:center; font-size:26px; overflow:hidden;
  }
  .p-body{flex:1; min-width:0;}
  .p-title{font-weight:600; font-size:14.5px; margin-bottom:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .p-price{font-weight:700; font-size:15.5px; color:var(--green-deep);}
  .p-meta{display:flex; flex-wrap:wrap; align-items:center; gap:6px; margin-top:5px; font-size:11.5px; color:var(--ink-soft);}
  .dot{color:var(--line);}
  .badge{
    display:inline-flex; align-items:center; gap:4px; font-size:10.5px; font-weight:700; padding:2px 7px; border-radius:999px;
  }
  .badge.avail{background:var(--green-mist); color:var(--green-deep);}
  .badge.unavail{background:#F1E3E1; color:var(--red);}
  .badge.low{background:var(--brick-mist); color:var(--brick);}
  .stars{color:var(--gold); font-size:11.5px; font-weight:700;}
  .fresh{font-size:10.5px; color:#8A9088; margin-top:3px;}

  /* ---- Shop card ---- */
  .s-card{
    background:var(--card); border:1px solid var(--line); border-radius:var(--radius-m); padding:12px; margin-bottom:10px; cursor:pointer;
  }
  .s-card-top{display:flex; gap:12px; align-items:center;}
  .s-thumb{width:52px;height:52px;border-radius:12px; background:var(--brick-mist); display:flex;align-items:center;justify-content:center;font-size:22px; flex-shrink:0;}
  .verified{color:var(--green); font-size:11px; font-weight:700; display:inline-flex; align-items:center; gap:3px;}

  /* ---- Buttons ---- */
  .btn{
    display:inline-flex; align-items:center; justify-content:center; gap:6px;
    border-radius:var(--radius-s); padding:12px 16px; font-weight:600; font-size:14px; cursor:pointer; border:1px solid transparent;
    width:100%;
  }
  .btn-primary{background:var(--green); color:#fff;}
  .btn-primary:active{background:var(--green-deep);}
  .btn-outline{background:var(--card); color:var(--ink); border-color:var(--line);}
  .btn-ghost{background:transparent; color:var(--green); border:none; padding:8px;}
  .btn-danger{background:#fff; color:var(--red); border-color:#E7C9C6;}
  .btn-row{display:flex; gap:8px;}
  .btn-row .btn{width:auto; flex:1;}
  .btn-sm{padding:8px 12px; font-size:13px; width:auto;}
  .btn[disabled]{opacity:.45; cursor:not-allowed;}

  /* ---- Bottom nav ---- */
  .bottomnav{
    position:fixed; bottom:0; left:50%; transform:translateX(-50%);
    width:100%; max-width:var(--maxw);
    background:var(--card); border-top:1px solid var(--line);
    display:flex; z-index:50;
    padding:6px 4px calc(6px + env(safe-area-inset-bottom));
  }
  .nav-item{
    flex:1; display:flex; flex-direction:column; align-items:center; gap:3px;
    border:none; background:none; padding:6px 2px; cursor:pointer; color:#9AA097; position:relative;
  }
  .nav-item.active{color:var(--green);}
  .nav-item .nlabel{font-size:10.5px; font-weight:600;}
  .nav-badge{
    position:absolute; top:2px; right:22%; background:var(--brick); color:#fff; font-size:9px; font-weight:700;
    min-width:15px; height:15px; border-radius:999px; display:flex; align-items:center; justify-content:center; padding:0 3px;
  }

  /* ---- Detail header / back ---- */
  .backbar{display:flex; align-items:center; gap:10px; margin-bottom:14px;}
  .backbtn{
    width:34px;height:34px;border-radius:999px; border:1px solid var(--line); background:var(--card);
    display:flex; align-items:center; justify-content:center; cursor:pointer; flex-shrink:0;
  }
  .gallery{
    width:100%; aspect-ratio:4/3; border-radius:var(--radius-l); background:var(--green-mist);
    display:flex; align-items:center; justify-content:center; font-size:56px; margin-bottom:14px; overflow:hidden;
  }
  .kv-row{display:flex; justify-content:space-between; padding:10px 0; border-bottom:1px solid var(--line); font-size:13.5px;}
  .kv-row:last-child{border-bottom:none;}

  /* ---- Cards / panels ---- */
  .panel{background:var(--card); border:1px solid var(--line); border-radius:var(--radius-m); padding:14px; margin-bottom:14px;}
  .field{margin-bottom:12px;}
  .field label{display:block; font-size:12.5px; font-weight:600; margin-bottom:5px; color:var(--ink-soft);}
  .field .req{color:var(--brick);}
  .field input, .field select, .field textarea{
    width:100%; border:1px solid var(--line); border-radius:var(--radius-s); padding:11px 12px; font-size:14.5px;
    background:var(--card); color:var(--ink); font-family:inherit;
  }
  .field textarea{resize:vertical; min-height:70px;}
  .field-hint{font-size:11.5px; color:#9AA097; margin-top:4px;}
  .toggle-row{display:flex; align-items:center; justify-content:space-between; padding:10px 0;}
  .switch{width:42px;height:24px;border-radius:999px; background:var(--line); position:relative; cursor:pointer; flex-shrink:0; border:none;}
  .switch.on{background:var(--green);}
  .switch::after{content:''; position:absolute; top:3px; left:3px; width:18px;height:18px;border-radius:50%; background:#fff; transition:left .15s;}
  .switch.on::after{left:21px;}

  /* ---- Empty / error states ---- */
  .empty-state{text-align:center; padding:50px 20px;}
  .empty-state .emoji{font-size:40px; margin-bottom:10px;}
  .empty-state h3{font-size:16px; margin-bottom:6px;}
  .empty-state p{font-size:13px; color:var(--ink-soft); margin-bottom:18px;}
  .empty-state .btn-row{max-width:280px; margin:0 auto; flex-direction:column;}

  .skeleton{background:linear-gradient(90deg,#EDEAE0 25%,#F5F3EC 37%,#EDEAE0 63%); background-size:400% 100%; animation:shimmer 1.3s infinite; border-radius:var(--radius-s);}
  @keyframes shimmer{0%{background-position:100% 50%;}100%{background-position:0 50%;}}

  .toast{
    position:fixed; bottom:76px; left:50%; transform:translateX(-50%); background:var(--ink); color:#fff;
    padding:10px 18px; border-radius:999px; font-size:13px; font-weight:500; z-index:99; box-shadow:var(--shadow);
    max-width:calc(var(--maxw) - 40px); text-align:center;
  }

  /* ---- Chat ---- */
  .conv-item{display:flex; gap:10px; padding:12px 0; border-bottom:1px solid var(--line); cursor:pointer; align-items:center;}
  .conv-ico{width:44px;height:44px;border-radius:12px; background:var(--brick-mist); display:flex; align-items:center; justify-content:center; font-size:19px; flex-shrink:0;}
  .conv-body{flex:1; min-width:0;}
  .conv-top{display:flex; justify-content:space-between; gap:6px;}
  .conv-name{font-weight:600; font-size:14px;}
  .conv-time{font-size:11px; color:#9AA097;}
  .conv-preview{font-size:12.5px; color:var(--ink-soft); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; margin-top:2px;}
  .unread-dot{width:9px;height:9px;border-radius:50%; background:var(--brick); flex-shrink:0;}

  .chat-screen{display:flex; flex-direction:column; height:calc(100vh - 0px);}
  .chat-messages{flex:1; overflow-y:auto; padding:14px 16px; display:flex; flex-direction:column; gap:8px;}
  .msg{max-width:78%; padding:9px 12px; border-radius:14px; font-size:13.5px; line-height:1.4;}
  .msg.in{background:var(--card); border:1px solid var(--line); align-self:flex-start; border-bottom-left-radius:4px;}
  .msg.out{background:var(--green); color:#fff; align-self:flex-end; border-bottom-right-radius:4px;}
  .msg-time{font-size:9.5px; opacity:.65; margin-top:3px;}
  .chat-input-row{display:flex; gap:8px; padding:10px 12px; border-top:1px solid var(--line); background:var(--paper); align-items:center;}
  .chat-input-row input{flex:1; border:1px solid var(--line); border-radius:999px; padding:11px 15px; font-size:14px; font-family:inherit;}
  .sendbtn{width:40px;height:40px;border-radius:50%; background:var(--green); border:none; color:#fff; display:flex; align-items:center; justify-content:center; cursor:pointer; flex-shrink:0;}
  .ref-card{display:flex; gap:8px; align-items:center; background:var(--card); border:1px solid var(--line); border-radius:var(--radius-s); padding:8px 10px; font-size:12px; margin:8px 16px 0;}

  /* ---- Reviews ---- */
  .review{padding:12px 0; border-bottom:1px solid var(--line);}
  .review:last-child{border-bottom:none;}
  .review-top{display:flex; justify-content:space-between; align-items:center; margin-bottom:4px;}
  .avatar{width:26px;height:26px;border-radius:50%; background:var(--green-mist); color:var(--green-deep); font-size:11px; font-weight:700; display:inline-flex; align-items:center; justify-content:center; margin-right:6px;}

  /* ---- Table (admin) ---- */
  .admin-stat{background:var(--card); border:1px solid var(--line); border-radius:var(--radius-m); padding:14px; text-align:center;}
  .admin-stat .num{font-family:'Fraunces',serif; font-size:24px; font-weight:600; color:var(--green-deep);}
  .admin-stat .lbl{font-size:11px; color:var(--ink-soft); margin-top:2px;}
  .grid2{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
  .list-row{display:flex; justify-content:space-between; align-items:center; padding:11px 0; border-bottom:1px solid var(--line); font-size:13px; gap:10px;}
  .list-row:last-child{border-bottom:none;}
  .status-tag{font-size:10.5px; font-weight:700; padding:2px 8px; border-radius:999px;}
  .status-new{background:var(--green-mist); color:var(--green-deep);}
  .status-verified{background:#DCEBF0; color:#26606E;}
  .status-suspended{background:#F1E3E1; color:var(--red);}
  .status-pending{background:var(--brick-mist); color:var(--brick);}

  .modal-bg{position:fixed; inset:0; background:rgba(23,31,25,.45); z-index:80; display:flex; align-items:flex-end; justify-content:center;}
  .modal-sheet{
    width:100%; max-width:var(--maxw); background:var(--paper); border-radius:20px 20px 0 0; padding:18px 16px calc(18px + env(safe-area-inset-bottom));
    max-height:85vh; overflow-y:auto;
  }
  .sheet-handle{width:36px; height:4px; background:var(--line); border-radius:999px; margin:0 auto 14px;}
  .list-tap{display:flex; align-items:center; justify-content:space-between; padding:13px 0; border-bottom:1px solid var(--line); cursor:pointer; font-size:14.5px;}
  .list-tap:last-child{border-bottom:none;}

  .fab{
    position:fixed; bottom:78px; left:50%; transform:translateX(calc(-50% + 190px)); z-index:45;
    width:52px;height:52px;border-radius:50%; background:var(--brick); color:#fff; border:none; box-shadow:var(--shadow);
    display:flex; align-items:center; justify-content:center; cursor:pointer; font-size:24px;
  }
  @media (max-width:400px){ .fab{transform:translateX(calc(-50% + 155px));} }

  .test-checklist{font-size:12px; line-height:1.9;}
  .test-checklist .grp{font-weight:700; margin-top:12px; color:var(--green-deep);}
</style>
</head>
<body>
<div id="app"></div>

<script>
/* =========================================================================
   CORNER — local shop discovery platform (front-end prototype)
   -------------------------------------------------------------------------
   Everything below simulates a real backend with an in-memory data store
   (`DB`). In production, DB would be replaced by real API calls to a
   server backed by a relational database (see README notes at the bottom
   of this file / the accompanying summary for the intended architecture).
   All actions here (add product, send message, submit review, moderate...)
   actually mutate DB and re-render from it — nothing is a fake button.
   ========================================================================= */

// ---------- Utilities ----------
const uid = (p='id') => p + '_' + Math.random().toString(36).slice(2,9);
const now = () => Date.now();
const fmtMoney = (n, cur='₹') => cur + Number(n).toLocaleString('en-IN');
function timeAgo(ts){
  const s = Math.floor((now()-ts)/1000);
  if(s<60) return 'just now';
  const m = Math.floor(s/60); if(m<60) return m+' min ago';
  const h = Math.floor(m/60); if(h<24) return h+' hr'+(h>1?'s':'')+' ago';
  const d = Math.floor(h/24); if(d<7) return d+' day'+(d>1?'s':'')+' ago';
  return new Date(ts).toLocaleDateString();
}
function haversine(lat1,lon1,lat2,lon2){
  const R=6371, toRad=x=>x*Math.PI/180;
  const dLat=toRad(lat2-lat1), dLon=toRad(lon2-lon1);
  const a=Math.sin(dLat/2)**2+Math.cos(toRad(lat1))*Math.cos(toRad(lat2))*Math.sin(dLon/2)**2;
  return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
}
function escapeHtml(s){ return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

// ---------- Seed "database" (demo data — clearly labeled, not real listings) ----------
const CENTER = {lat:19.0760, lng:72.8777}; // demo city center (customer's default area)

const CATEGORIES = [
  {id:'electronics', name:'Electronics', icon:'🔌'},
  {id:'grocery', name:'Grocery', icon:'🥬'},
  {id:'clothing', name:'Clothing', icon:'👕'},
  {id:'hardware', name:'Hardware', icon:'🔧'},
  {id:'bakery', name:'Bakery', icon:'🥐'},
  {id:'pharmacy', name:'Pharmacy', icon:'💊'},
  {id:'stationery', name:'Stationery', icon:'✏️'},
  {id:'furniture', name:'Furniture', icon:'🪑'},
];

function mkShop(o){ return Object.assign({
  id: uid('shop'), rating:0, reviewCount:0, verification:'new', createdAt: now()-Math.floor(Math.random()*9e8),
  hours:'9:00 AM – 9:00 PM', photos:[], lat: CENTER.lat + (Math.random()-0.5)*0.04, lng: CENTER.lng + (Math.random()-0.5)*0.04,
}, o); }

const DB = {
  users: [
    {id:'u_customer', role:'customer', name:'You (Customer)', email:'you@example.com'},
    {id:'u_shopkeeper', role:'shopkeeper', name:'You (Shopkeeper)', email:'shop@example.com', shopId:null},
    {id:'u_admin', role:'admin', name:'You (Admin)', email:'admin@example.com'},
  ],
  currentUserByRole: {customer:'u_customer', shopkeeper:'u_shopkeeper', admin:'u_admin'},
  customerLocation: {label:'Bandra West, Mumbai', lat:CENTER.lat, lng:CENTER.lng, permission:'unset'},
  shops: [],
  products: [],
  reviews: [],
  favorites: [], // {userId, type:'product'|'shop', id}
  conversations: [], // {id, customerId, shopId, productId, messages:[], reportedBy:[]}
  requests: [], // {id, customerId, name, description, radius, createdAt, responses:[]}
  reports: [], // {id, type, targetId, reason, status, createdAt}
  notifications: [], // {id, userId, text, read, createdAt}
};

(function seed(){
  const s1 = mkShop({name:'Kadam Electronics', category:'electronics', ownerId:'u_shopkeeper', description:'Family-run electronics store, 20+ years in the neighbourhood. Genuine products with bills.', address:'12 SV Road, Bandra West', verification:'verified'});
  const s2 = mkShop({name:'Green Basket Grocers', category:'grocery', ownerId:'u_owner2', description:'Fresh produce, daily essentials and local staples, restocked every morning.', address:'4 Hill Road, Bandra West', verification:'verified'});
  const s3 = mkShop({name:'Studio Thread Clothing', category:'clothing', ownerId:'u_owner3', description:'Everyday and festive wear for the whole family.', address:'22 Linking Road, Bandra West', verification:'active'});
  const s4 = mkShop({name:'Patel Hardware & Tools', category:'hardware', ownerId:'u_owner4', description:'Tools, fittings and hardware supplies for home and workshop.', address:'8 Turner Road, Bandra West', verification:'verified'});

// ---------- Search / filter logic ----------
function distanceFor(shop){ return haversine(DB.customerLocation.lat, DB.customerLocation.lng, shop.lat, shop.lng); }
function isShopOpenNow(){ return true; } // demo: hours parsing simplified; architecture supports real hours later

function searchResults(){
  const q = State.search.q.trim().toLowerCase();
  const f = State.search.filters;
  let items = DB.products.map(p => ({p, shop: DB.shops.find(s=>s.id===p.shopId)}));

  if(State.search.category) items = items.filter(x => x.p.category === State.search.category);
  if(q){
    items = items.filter(x => {
      const hay = [x.p.name, x.p.brand, x.p.model, x.p.description, x.shop.name].join(' ').toLowerCase();
      return q.split(' ').every(term => hay.includes(term));
    });
  }
  items = items.map(x => Object.assign({}, x, {dist: distanceFor(x.shop)}));
  items = items.filter(x => x.dist <= f.maxDistance);
  if(f.availOnly) items = items.filter(x => x.p.availability !== 'out_of_stock');
  if(f.minRating) items = items.filter(x => x.shop.rating >= f.minRating);
  if(f.priceMax) items = items.filter(x => x.p.price <= f.priceMax);
  if(f.openNow) items = items.filter(() => isShopOpenNow());

  switch(State.search.sort){
    case 'nearest': items.sort((a,b)=>a.dist-b.dist); break;
    case 'price_low': items.sort((a,b)=>a.p.price-b.p.price); break;
    case 'rating': items.sort((a,b)=>b.shop.rating-a.shop.rating); break;
    case 'recent': items.sort((a,b)=>b.p.lastUpdated-a.p.lastUpdated); break;
    default: items.sort((a,b)=> (b.shop.rating - a.shop.rating*0.3) - a.dist*0.05 - (a.dist-b.dist)); // transparent blended default
  }
  return items;
}

// ---------- Rendering ----------
function render(){
  const root = document.getElementById('app');
  root.innerHTML = topbarHtml() + viewHtml() + (needsBottomNav()?bottomNavHtml():'') + (State.toast?`<div class="toast">${escapeHtml(State.toast)}</div>`:'');
  bindEvents(root);
  const modalHost = document.getElementById('modal-root');
  if(modalHost) modalHost.innerHTML = modalHtml();
  if(document.getElementById('modal-root')) bindEvents(document.getElementById('modal-root'));
}

function needsBottomNav(){
  return !['chat-thread'].includes(State.view);
}

function chatListView(){
  const u = currentUser();

      const icon = isShop ? '🙂' : (CATEGORIES.find(cc=>cc.id===other.category)?.icon || '🏬');
      return `<div class="conv-item" data-nav="chat-thread" data-id="${c.id}">

  const isShop = State.role==='shopkeeper';

    </div>
    <div class="panel">
      <div class="kv-row"><span class="muted">Verification status</span><span class="status-tag ${shop.verification==='verified'?'status-verified':shop.verification==='suspended'?'status-suspended':'status-new'}">${shop.verification}</span></div>
      <p class="small muted" style="margin-top:8px;">Verification is reviewed by the Corner team and confirms your shop's physical address and legitimacy.</p>
    </div>
    <button class="btn btn-outline" data-nav="sk-dashboard">Back to dashboard</button>
  </div>`;
}

// ---------- ADMIN views ----------
function adminDashboard(){
  const stats = [
    {n: DB.shops.length, l:'Total shops'},
    {n: DB.shops.filter(s=>s.verification==='verified').length, l:'Verified shops'},
    {n: DB.products.length, l:'Products listed'},
    {n: DB.reports.filter(r=>r.status==='open').length, l:'Open reports'},
    {n: DB.reviews.length, l:'Reviews'},
    {n: DB.requests.length, l:'Product requests'},
  ];
  return `<div class="view">
    <h1 style="font-size:20px;margin-bottom:14px;">Platform overview</h1>
    <div class="grid2" style="margin-bottom:16px;">${stats.map(s=>`<div class="admin-stat"><div class="num">${s.n}</div><div class="lbl">${s.l}</div></div>`).join('')}</div>
    <div class="section-head"><h2>Shops pending verification</h2></div>
    ${DB.shops.filter(s=>s.verification==='new'||s.verification==='active').map(s=>`
      <div class="list-row"><span>${escapeHtml(s.name)}</span>
      <span><button class="btn btn-primary btn-sm" data-verify="${s.id}">Verify</button></span></div>`).join('') || `<p class="small muted">Nothing pending.</p>`}
  </div>`;
}
function adminShopsView(){
  return `<div class="view">
    <h1 style="font-size:20px;margin-bottom:14px;">Manage shops</h1>
    ${DB.shops.map(s=>`
      <div class="panel">
        <div style="display:flex;justify-content:space-between;align-items:center;">
          <strong style="font-size:14px;">${escapeHtml(s.name)}</strong>
          <span class="status-tag ${s.verification==='verified'?'status-verified':s.verification==='suspended'?'status-suspended':'status-new'}">${s.verification}</span>
        </div>
        <p class="small muted" style="margin:4px 0 8px;">${escapeHtml(s.address)} · ${DB.products.filter(p=>p.shopId===s.id).length} products</p>
        <div class="btn-row">
          ${s.verification!=='verified'?`<button class="btn btn-outline btn-sm" data-verify="${s.id}">Verify</button>`:''}
          ${s.verification!=='suspended'?`<button class="btn btn-danger btn-sm" data-suspend="${s.id}">Suspend</button>`:`<button class="btn btn-outline btn-sm" data-unsuspend="${s.id}">Reinstate</button>`}
        </div>
      </div>`).join('')}
  </div>`;
}
function adminReportsView(){
  return `<div class="view">
    <h1 style="font-size:20px;margin-bottom:14px;">Reports</h1>
    ${DB.reports.length ? DB.reports.slice().sort((a,b)=>b.createdAt-a.createdAt).map(r=>`
      <div class="panel">
        <div style="display:flex;justify-content:space-between;"><strong style="font-size:13.5px;">${escapeHtml(r.type)}</strong><span class="status-tag ${r.status==='open'?'status-pending':'status-verified'}">${r.status}</span></div>
        <p class="small muted" style="margin:4px 0 8px;">${escapeHtml(r.reason)} · ${timeAgo(r.createdAt)}</p>
        ${r.status==='open'?`<div class="btn-row"><button class="btn btn-outline btn-sm" data-resolve-report="${r.id}">Mark resolved</button></div>`:''}
      </div>`).join('') : emptyState({emoji:'🚩', title:'No reports', body:'User-submitted reports about listings, reviews or conversations will appear here.', actions:[{label:'Back to overview', nav:'admin-dashboard'}]})}
  </div>`;
}
function adminReviewsView(){
  return `<div class="view">
    <h1 style="font-size:20px;margin-bottom:14px;">Moderate reviews</h1>
    ${DB.reviews.slice().sort((a,b)=>b.date-a.date).map(r=>{
      const shop = DB.shops.find(s=>s.id===r.shopId);
      return `<div class="panel">
        <div style="display:flex;justify-content:space-between;"><strong style="font-size:13.5px;">${escapeHtml(shop.name)}</strong><span class="small muted">${timeAgo(r.date)}</span></div>
        <div class="stars">${'★'.repeat(r.rating)}${'☆'.repeat(5-r.rating)}</div>
        <p class="small" style="margin:4px 0 8px;">${escapeHtml(r.text)}</p>
        <div class="btn-row"><button class="btn btn-danger btn-sm" data-del-review="${r.id}">Remove review</button></div>
      </div>`;
    }).join('')}
  </div>`;
}

// ---------- Modals ----------
let modalState = null; // {type, ...}
function modalHtml(){
  if(!modalState) return '';
  if(modalState.type==='location') return modal(`
    <h3 style="margin-bottom:14px;">Location settings</h3>
    <p class="small muted" style="margin-bottom:14px;">Corner uses your location to show nearby shops. You can also set it manually — the site works fully without location access.</p>
    <button class="btn btn-outline" id="use-my-location" style="margin-bottom:10px;">📍 Use my current location</button>
    ${['Bandra West, Mumbai','Andheri East, Mumbai','Koramangala, Bengaluru','Connaught Place, Delhi'].map(l=>`<div class="list-tap" data-setloc="${l}"><span>${l}</span><span>${DB.customerLocation.label===l?'✓':''}</span></div>`).join('')}
  `);
  if(modalState.type==='privacy') return modal(`
    <h3 style="margin-bottom:14px;">Privacy settings</h3>
    <div class="toggle-row"><span class="small">Share precise location with search</span><button class="switch on"></button></div>
    <div class="toggle-row"><span class="small">Allow shops to see my past searches</span><button class="switch"></button></div>
    <div class="toggle-row"><span class="small">Personalized recommendations</span><button class="switch on"></button></div>
    <p class="field-hint" style="margin:10px 0 14px;">Your exact location is never shared with shopkeepers — only approximate distance.</p>
    <button class="btn btn-outline btn-danger" data-close-modal style="margin-bottom:8px;">Delete my account &amp; data</button>
  `);
  if(modalState.type==='notif') return modal(`
    <h3 style="margin-bottom:14px;">Notifications</h3>
    <div class="toggle-row"><span class="small">New chat messages</span><button class="switch on"></button></div>
    <div class="toggle-row"><span class="small">Responses to my requests</span><button class="switch on"></button></div>
    <div class="toggle-row"><span class="small">Price drops on saved items</span><button class="switch"></button></div>
  `);
  if(modalState.type==='write-review') return modal(`
    <h3 style="margin-bottom:14px;">Write a review</h3>
    <div class="field"><label>Rating</label>
      <div style="display:flex;gap:6px;" id="star-picker">${[1,2,3,4,5].map(n=>`<span data-star="${n}" style="font-size:26px;cursor:pointer;color:${n<= (modalState.rating||0)?'var(--gold)':'#DEDACC'};">★</span>`).join('')}</div>
    </div>
    <div class="field"><label>Your review</label><textarea id="rev-text" placeholder="Share your experience with this shop"></textarea></div>
    <button class="btn btn-primary" id="rev-submit" data-shopid="${modalState.shopId}">Submit review</button>
  `);
  if(modalState.type==='report') return modal(`
    <h3 style="margin-bottom:14px;">Report a problem</h3>
    <div class="field"><label>What's wrong?</label>
      <select id="report-reason" class="select-native" style="width:100%;">
        <option>Incorrect price or availability</option>
        <option>Suspicious or fake listing</option>
        <option>Inappropriate content</option>
        <option>Other</option>
      </select>
    </div>
    <button class="btn btn-primary" id="report-submit" data-target="${modalState.target}">Submit report</button>
  `);
  return '';
}
function modal(inner){
  return `<div id="modal-root-inner"><div class="modal-bg" data-close-modal>
    <div class="modal-sheet" onclick="event.stopPropagation()">
      <div class="sheet-handle"></div>
      ${inner}
    </div>
  </div></div>`;
}

// ---------- Event binding ----------
function bindEvents(root){
  root.querySelectorAll('[data-role]').forEach(el=>el.onclick = ()=>{ State.role = el.dataset.role; State.view = el.dataset.role==='customer'?'home':el.dataset.role==='shopkeeper'?'sk-dashboard':'admin-dashboard'; State.history=[]; render(); });
  root.querySelectorAll('[data-nav]').forEach(el=>el.onclick = ()=>{ const id = el.dataset.id; nav(el.dataset.nav, id?{id}:{}); });
  root.querySelectorAll('[data-back]').forEach(el=>el.onclick = back);
  root.querySelectorAll('[data-cat]').forEach(el=>el.onclick = ()=>{ State.search.category = el.dataset.cat; State.search.q=''; nav('search'); });
  root.querySelectorAll('[data-setcat]').forEach(el=>el.onclick = ()=>{ State.search.category = el.dataset.setcat || null; render(); });
  root.querySelectorAll('[data-toggle]').forEach(el=>el.onclick = ()=>{
    const t = el.dataset.toggle;
    if(t==='availOnly') State.search.filters.availOnly = !State.search.filters.availOnly;
    if(t==='openNow') State.search.filters.openNow = !State.search.filters.openNow;
    if(t==='minRating') State.search.filters.minRating = State.search.filters.minRating>=4?0:4;
    if(t==='near') State.search.filters.maxDistance = State.search.filters.maxDistance<=5?20:5;
    render();
  });
  const sortSel = root.querySelector('#sort-select');
  if(sortSel) sortSel.onchange = ()=>{ State.search.sort = sortSel.value; render(); };
  const searchInput = root.querySelector('#search-input');
  if(searchInput){
    searchInput.oninput = ()=>{ State.search.q = searchInput.value; renderResultsOnly(); };
    searchInput.focus(); searchInput.selectionStart = searchInput.value.length;
  }
  const heroSearch = root.querySelector('#hero-search');
  if(heroSearch) heroSearch.onclick = ()=> nav('search');
  const shopSearch = root.querySelector('#shop-search');
  if(shopSearch) shopSearch.oninput = ()=>{
    const q = shopSearch.value.toLowerCase();
    const list = DB.products.filter(p=>p.shopId===shopSearch.dataset.shopid && p.name.toLowerCase().includes(q));
    document.getElementById('shop-prod-list').innerHTML = list.map(p=>productCardMini(p)).join('') || `<p class="small muted">No matches in this shop.</p>`;
    bindEvents(document.getElementById('shop-prod-list'));
  };

  // favorites
  root.querySelectorAll('[data-fav-product]').forEach(el=>el.onclick=(e)=>{ e.stopPropagation(); toggleFav('product', el.dataset.favProduct); });
  root.querySelectorAll('[data-fav-shop]').forEach(el=>el.onclick=(e)=>{ e.stopPropagation(); toggleFav('shop', el.dataset.favShop); });

  // chat entry points
  root.querySelectorAll('[data-chat-shop]').forEach(el=>el.onclick=(e)=>{ e.stopPropagation(); startOrOpenChat(el.dataset.chatShop, el.dataset.chatProduct||null); });

  root.querySelectorAll('[data-directions]').forEach(el=>el.onclick=(e)=>{ e.stopPropagation(); showToast('Opening directions to the shop...'); });
  root.querySelectorAll('[data-share]').forEach(el=>el.onclick=(e)=>{ e.stopPropagation(); showToast('Link copied to share.'); });
  root.querySelectorAll('[data-report]').forEach(el=>el.onclick=(e)=>{ e.stopPropagation(); modalState={type:'report', target:el.dataset.report}; render(); });

  // location
  root.querySelectorAll('[data-open="location"]').forEach(el=>el.onclick=()=>{ modalState={type:'location'}; render(); });
  root.querySelectorAll('[data-open="privacy"]').forEach(el=>el.onclick=()=>{ modalState={type:'privacy'}; render(); });
  root.querySelectorAll('[data-open="notif"]').forEach(el=>el.onclick=()=>{ modalState={type:'notif'}; render(); });
  root.querySelectorAll('[data-open="write-review"]').forEach(el=>el.onclick=()=>{ modalState={type:'write-review', shopId:el.dataset.shopid, rating:5}; render(); });
  root.querySelectorAll('[data-close-modal]').forEach(el=>el.onclick=()=>{ modalState=null; render(); });
  root.querySelectorAll('[data-setloc]').forEach(el=>el.onclick=()=>{ DB.customerLocation.label = el.dataset.setloc; modalState=null; render(); });
  const useLoc = root.querySelector('#use-my-location');
  if(useLoc) useLoc.onclick = ()=>{
    if(!navigator.geolocation){ showToast('Location not supported on this device.'); return; }
    useLoc.textContent = 'Locating...';
    navigator.geolocation.getCurrentPosition(
      pos=>{ DB.customerLocation.lat=pos.coords.latitude; DB.customerLocation.lng=pos.coords.longitude; DB.customerLocation.label='Current location'; DB.customerLocation.permission='granted'; modalState=null; render(); },
      err=>{ DB.customerLocation.permission='denied'; showToast('Location permission denied — you can still search by area.'); modalState=null; render(); }
    );
  };
  root.querySelectorAll('[data-star]').forEach(el=>el.onclick=()=>{ modalState.rating = Number(el.dataset.star); render(); });
  const revSubmit = root.querySelector('#rev-submit');
  if(revSubmit) revSubmit.onclick = ()=>{
    const text = document.getElementById('rev-text').value.trim();
    if(!text){ showToast('Please write a few words about your experience.'); return; }
    const u = currentUser();
    DB.reviews.unshift({id:uid('rev'), shopId:revSubmit.dataset.shopid, userId:u.id, userName:u.name, rating: modalState.rating||5, text, date: now(), reply:null});
    window._recalcRating(revSubmit.dataset.shopid);
    modalState = null; showToast('Review posted.'); render();
  };
  const reportSubmit = root.querySelector('#report-submit');
  if(reportSubmit) reportSubmit.onclick = ()=>{
    const reason = document.getElementById('report-reason').value;
    DB.reports.push({id:uid('rep'), type:reportSubmit.dataset.target, reason, status:'open', createdAt:now()});
    modalState = null; showToast('Thanks — our team will review this.'); render();
  };

  // requests
  const rqSubmit = root.querySelector('#rq-submit');
  if(rqSubmit) rqSubmit.onclick = ()=>{
    const name = document.getElementById('rq-name').value.trim();
    if(!name){ showToast('Please enter a product name.'); return; }
    DB.requests.push({id:uid('req'), customerId: currentUser().id, name, description: document.getElementById('rq-desc').value.trim(), radius: Number(document.getElementById('rq-radius').value), createdAt: now(), responses:[]});
    showToast('Request sent to nearby shops.'); nav('requests', {}, true);
  };
  root.querySelectorAll('[data-act="widen"]').forEach(el=>el.onclick=()=>{ State.search.filters.maxDistance=20; render(); });

  // chat send
  const chatSend = root.querySelector('#chat-send');
  if(chatSend){
    const doSend = ()=>{
      const input = document.getElementById('chat-input');
      const text = input.value.trim(); if(!text) return;
      const conv = DB.conversations.find(c=>c.id===chatSend.dataset.convid);
      const sender = State.role==='shopkeeper' ? 'shop':'customer';
      conv.messages.push({sender, text, time: now()});
      if(sender==='customer') conv.unreadForShop++; else conv.unreadForCustomer++;
      input.value='';
      render();
      // auto-scroll
      const scroll = document.getElementById('chat-scroll'); if(scroll) scroll.scrollTop = scroll.scrollHeight;
    };
    chatSend.onclick = doSend;
    const chatInput = root.querySelector('#chat-input');
    if(chatInput){ chatInput.onkeydown = (e)=>{ if(e.key==='Enter') doSend(); }; chatInput.focus(); }
    const scroll = document.getElementById('chat-scroll'); if(scroll) scroll.scrollTop = scroll.scrollHeight;
  }

  // shopkeeper onboarding
  const obSubmit = root.querySelector('#ob-submit');
  if(obSubmit) obSubmit.onclick = ()=>{
    const name = document.getElementById('ob-name').value.trim();
    const addr = document.getElementById('ob-addr').value.trim();
    if(!name || !addr){ showToast('Shop name and address are required.'); return; }
    const shop = mkShop({name, category: document.getElementById('ob-cat').value, address: addr, description: document.getElementById('ob-desc').value.trim(), ownerId: currentUser().id});
    DB.shops.push(shop);
    currentUser().shopId = shop.id;
    showToast('Shop created!'); nav('sk-product-form', {}, true);
  };

  // shopkeeper products
  root.querySelectorAll('[data-edit-product]').forEach(el=>el.onclick=()=>nav('sk-product-form', {id: el.dataset.editProduct}));
  root.querySelectorAll('[data-cycle-avail]').forEach(el=>el.onclick=()=>{
    const p = DB.products.find(x=>x.id===el.dataset.cycleAvail);
    const order = ['in_stock','low_stock','out_of_stock'];
    p.availability = order[(order.indexOf(p.availability)+1)%order.length];
    p.lastUpdated = now(); showToast('Availability updated.'); render();
  });
  root.querySelectorAll('[data-del-product]').forEach(el=>el.onclick=()=>{
    if(!confirm('Delete this product?')) return;
    DB.products = DB.products.filter(x=>x.id!==el.dataset.delProduct);
    showToast('Product deleted.'); render();
  });
  const pfSubmit = root.querySelector('#pf-submit');
  if(pfSubmit) pfSubmit.onclick = ()=>{
    const name = document.getElementById('pf-name').value.trim();
    const price = Number(document.getElementById('pf-price').value);
    if(!name || !price || price<=0){ showToast('Product name and a valid price are required.'); return; }
    const shop = DB.shops.find(s=>s.id===currentUser().shopId);
    const data = {
      name, price, availability: document.getElementById('pf-avail').value,
      brand: document.getElementById('pf-brand').value.trim(), model: document.getElementById('pf-model').value.trim(),
      description: document.getElementById('pf-desc').value.trim(), lastUpdated: now(),
    };
    if(pfSubmit.dataset.editid){
      Object.assign(DB.products.find(x=>x.id===pfSubmit.dataset.editid), data);
      showToast('Product updated.');
    } else {
      DB.products.push(Object.assign({id:uid('prod'), shopId:shop.id, currency:'₹', condition:'New', category:shop.category, icon:'🏷️'}, data));
      showToast('Product published.');
    }
    nav('sk-products', {}, true);
  };
  const ssSubmit = root.querySelector('#ss-submit');
  if(ssSubmit) ssSubmit.onclick = ()=>{
    const shop = DB.shops.find(s=>s.id===currentUser().shopId);
    shop.name = document.getElementById('ss-name').value.trim() || shop.name;
    shop.description = document.getElementById('ss-desc').value.trim();
    shop.address = document.getElementById('ss-addr').value.trim() || shop.address;
    shop.hours = document.getElementById('ss-hours').value.trim() || shop.hours;
    showToast('Shop settings saved.'); render();
  };
  root.querySelectorAll('[data-respond-req]').forEach(el=>el.onclick=()=>{
    const req = DB.requests.find(x=>x.id===el.dataset.respondReq);
    const shop = DB.shops.find(s=>s.id===currentUser().shopId);
    const available = el.dataset.avail==='1';
    let price = null;
    if(available){ price = Number(prompt('What price would you like to quote (₹)?','')||0); if(!price){ showToast('Response cancelled.'); return; } }
    req.responses.push({shopId: shop.id, available, price});
    showToast('Response sent to customer.'); render();
  });

  // admin
  root.querySelectorAll('[data-verify]').forEach(el=>el.onclick=()=>{ DB.shops.find(s=>s.id===el.dataset.verify).verification='verified'; showToast('Shop verified.'); render(); });
  root.querySelectorAll('[data-suspend]').forEach(el=>el.onclick=()=>{ if(confirm('Suspend this shop?')){ DB.shops.find(s=>s.id===el.dataset.suspend).verification='suspended'; showToast('Shop suspended.'); render(); } });
  root.querySelectorAll('[data-unsuspend]').forEach(el=>el.onclick=()=>{ DB.shops.find(s=>s.id===el.dataset.unsuspend).verification='active'; showToast('Shop reinstated.'); render(); });
  root.querySelectorAll('[data-resolve-report]').forEach(el=>el.onclick=()=>{ DB.reports.find(r=>r.id===el.dataset.resolveReport).status='resolved'; showToast('Report resolved.'); render(); });
  root.querySelectorAll('[data-del-review]').forEach(el=>el.onclick=()=>{
    if(!confirm('Remove this review?')) return;
    const rev = DB.reviews.find(r=>r.id===el.dataset.delReview);
    DB.reviews = DB.reviews.filter(r=>r.id!==el.dataset.delReview);
    window._recalcRating(rev.shopId);
    showToast('Review removed.'); render();
  });
}

function renderResultsOnly(){ render(); const si = document.getElementById('search-input'); if(si){ si.focus(); si.selectionStart = si.value.length; } }

function toggleFav(type, id){
  const u = currentUser();
  const idx = DB.favorites.findIndex(f=>f.userId===u.id && f.type===type && f.id===id);
  if(idx>-1) DB.favorites.splice(idx,1); else DB.favorites.push({userId:u.id, type, id});
  render();
}
function startOrOpenChat(shopId, productId){
  const u = currentUser();
  let conv = DB.conversations.find(c=>c.customerId===u.id && c.shopId===shopId && (!productId || c.productId===productId));
  if(!conv){
    conv = {id:uid('conv'), customerId:u.id, shopId, productId, unreadForCustomer:0, unreadForShop:1, messages:[
      {sender:'customer', text: productId ? `Hi, is this still available?` : `Hi, I had a question about your shop.`, time: now()}
    ]};
    DB.conversations.push(conv);
  }
  nav('chat-thread', {id: conv.id});
}

// initial mount
document.body.insertAdjacentHTML('beforeend', `<div id="modal-root"></div>`);
render();
</script>
